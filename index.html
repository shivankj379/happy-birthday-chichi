<style>
  :root {
    --ink:      #0C1E1B;
    --ink-2:    #13302A;
    --blush:    #F2A6A0;
    --coral:    #E4705A;
    --gold:     #E9C27E;
    --cream:    #FAF2E4;
    --sage:     #78A38A;
    --muted:    #8FA69C;

    --display: "Fraunces", "Iowan Old Style", Georgia, serif;
    --body:    "Karla", "Helvetica Neue", Arial, sans-serif;
    --hand:    "Caveat", "Bradley Hand", cursive;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--cream);
    min-height: 100%;
  }

  body {
    font-family: var(--body);
    font-weight: 300;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Ambient ground: a warm pool of light behind the bouquet, cool at the edges */
  .ground {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(58vmin 58vmin at 50% 46%, rgba(233,194,126,.16), transparent 68%),
      radial-gradient(90vmin 70vmin at 50% 120%, rgba(19,48,42,.9), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  #petals {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3;
  }

  .stage {
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    max-height: 100dvh;
    overflow-y: auto;
    display: grid;
    place-items: center;
    padding: 4vmin 6vw;
  }

  .act {
    grid-area: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1rem, 3.2vh, 2.2rem);
    text-align: center;
    max-width: 34rem;
  }

  .act[data-hidden="true"] {
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
  }

  .eyebrow {
    margin: 0;
    font-family: var(--body);
    font-size: .74rem;
    font-weight: 500;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .gift-line {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: min(clamp(1.7rem, 4.6vw, 2.7rem), 9vh);
    line-height: 1.22;
    text-wrap: balance;
    color: var(--cream);
  }
  .gift-line em {
    font-style: normal;
    color: var(--gold);
  }

  /* --- the bouquet is the button --- */
  .bouquet {
    appearance: none;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    display: block;
    width: min(70vw, 36vh, 340px);
    border-radius: 12px;
    transition: transform .5s cubic-bezier(.2,.8,.3,1);
  }
  .bouquet svg { display: block; width: 100%; height: auto; overflow: visible; }
  .bouquet:hover  { transform: scale(1.035); }
  .bouquet:active { transform: scale(.99); }
  .bouquet:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 14px;
  }

  .sway { transform-box: fill-box; transform-origin: 50% 92%; animation: sway 6.5s ease-in-out infinite; }
  @keyframes sway {
    0%, 100% { transform: rotate(-1.6deg); }
    50%      { transform: rotate(1.6deg); }
  }

  .hint {
    margin: 0;
    font-family: var(--hand);
    font-size: min(clamp(1.8rem, 5vw, 2.4rem), 9vh);
    color: var(--gold);
    opacity: .78;
    animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity:.45 } 50% { opacity:.95 } }

  /* --- act two --- */
  .wish-line {
    margin: 0;
    font-family: var(--display);
    font-variation-settings: "SOFT" 60, "WONK" 1, "opsz" 120;
    font-weight: 500;
    font-size: min(clamp(2.4rem, 9vw, 4.6rem), 13vh);
    line-height: 1.02;
    letter-spacing: -.015em;
    text-wrap: balance;
  }
  .wish-line .name {
    display: block;
    background: linear-gradient(100deg, var(--gold) 0%, var(--blush) 46%, var(--coral) 92%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .photo {
    margin: 0;
    width: min(30rem, 100%);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(233,194,126,.34);
    box-shadow: 0 20px 44px -14px rgba(0,0,0,.7), 0 0 0 6px rgba(19,48,42,.55);
    transform: rotate(-1.7deg);
    transition: transform .6s cubic-bezier(.2,.8,.3,1);
  }
  .photo:hover { transform: rotate(0deg) scale(1.015); }
  .photo img {
    display: block;
    width: 100%;
    height: auto;
  }

  .message {
    margin: 0;
    font-size: clamp(1rem, 2.4vw, 1.1rem);
    line-height: 1.7;
    max-width: 30rem;
    color: #D9E2DC;
  }

  .signature {
    margin: 0;
    font-family: var(--hand);
    font-size: 1.6rem;
    color: var(--blush);
  }

  .replay {
    appearance: none;
    cursor: pointer;
    font-family: var(--body);
    font-size: .72rem;
    font-weight: 500;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: 1px solid rgba(143,166,156,.3);
    border-radius: 999px;
    padding: .7rem 1.4rem;
    transition: color .3s, border-color .3s;
  }
  .replay:hover { color: var(--gold); border-color: rgba(233,194,126,.55); }
  .replay:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  #riser {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(.85rem, 2.4vh, 1.6rem);
  }

  /* --- the bloom: staged reveal + dismissal --- */
  .rise > * {
    opacity: 0;
    transform: translateY(18px);
    animation: rise .9s cubic-bezier(.2,.8,.3,1) forwards;
  }
  .rise > *:nth-child(1) { animation-delay: .10s }
  .rise > *:nth-child(2) { animation-delay: .22s }
  .rise > *:nth-child(3) { animation-delay: .32s }
  .rise > *:nth-child(4) { animation-delay: .42s }
  .rise > *:nth-child(5) { animation-delay: .56s }
  .rise > *:nth-child(6) { animation-delay: .78s }
  @keyframes rise { to { opacity: 1; transform: none } }

  .act--gift { transition: opacity .45s ease, transform .6s cubic-bezier(.4,0,.6,1); }
  .act--gift[data-leaving="true"] { opacity: 0; transform: translateY(-26px) scale(.97); }

  /* flower heads fly outward, paper falls open */
  .head { transition: transform .95s cubic-bezier(.16,.9,.3,1), opacity .8s ease .15s; }
  .bouquet[data-open="true"] .head { opacity: 0; }
  .paper { transition: transform 1s cubic-bezier(.2,.9,.3,1), opacity .9s ease; transform-box: fill-box; transform-origin: 50% 100%; }
  .bouquet[data-open="true"] .paper--l { transform: rotate(-34deg) translateY(10px); opacity: .25; }
  .bouquet[data-open="true"] .paper--r { transform: rotate( 34deg) translateY(10px); opacity: .25; }
  .bouquet[data-open="true"] .sway { animation: none; }

  /* Landscape phones / very short windows: shed the decorative bits */
  @media (max-height: 430px) {
    .stage { padding: 2vmin 4vw; }
    .act--gift .eyebrow { display: none; }
    .bouquet { width: min(52vw, 33vh, 340px); }
    .photo { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sway, .hint { animation: none; }
    .rise > * { opacity: 1; transform: none; animation: none; }
    .head, .paper, .bouquet, .act--gift { transition: none; }
    .photo { transform: none; transition: none; }
  }
</style>

<script>
/* ------------------------------------------------------------------
   Everything you'd want to change lives here.
------------------------------------------------------------------ */
const WISH = {
  name:    "Chichi!",
  giftLine:"Hey! This one's for the <em>bestest</em> there is.",
  opener:  "today of all days",
  message: "I hope this year brings you lots of happiness, beautiful moments, and everything you deserve. " +
           "Stay the person you are, " +
           "exactly as lovely, and exactly as slightly moody. " +
           "Happy birthday! \u{1FAF6}",
  signature: "with love \u2665"
};

document.getElementById("giftLine").innerHTML = WISH.giftLine;
document.getElementById("wName").textContent    = WISH.name;
document.getElementById("wOpener").textContent  = WISH.opener;
document.getElementById("wMessage").textContent = WISH.message;
document.getElementById("wSig").textContent     = WISH.signature;

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ------------------------------------------------------------------
   Bouquet, built parametrically so the flowers aren't hand-plotted.
------------------------------------------------------------------ */
const PETAL_COLORS = [
  ["#F2A6A0", "#E4705A"],
  ["#F6C9BC", "#E08E78"],
  ["#E9C27E", "#D4A059"],
  ["#EFB7C4", "#D97F94"],
  ["#FAF2E4", "#E3D2B6"]
];

const KNOT = { x: 200, y: 336 };

// x, y, radius, petal count, palette index, rotation
const FLOWERS = [
  [200,  92, 42, 8, 0],
  [126, 132, 34, 7, 1],
  [274, 130, 35, 7, 3],
  [ 92, 208, 29, 6, 2],
  [308, 205, 30, 6, 4],
  [168, 178, 31, 7, 4],
  [236, 182, 30, 7, 2],
  [200, 246, 25, 6, 1]
];

const svgns = "http://www.w3.org/2000/svg";
const el = (n, a) => { const e = document.createElementNS(svgns, n); for (const k in a) e.setAttribute(k, a[k]); return e; };

function buildBouquet() {
  const svg = el("svg", { viewBox: "0 0 400 470", role: "img" });
  const sway = el("g", { class: "sway" });

  // stems bundled below the knot
  const bundle = el("g", { stroke: "#5C8A6E", "stroke-width": 5, "stroke-linecap": "round", fill: "none", opacity: ".9" });
  [-16, -6, 5, 15].forEach((d, i) => {
    bundle.appendChild(el("path", { d: `M${KNOT.x + d * .35},${KNOT.y + 4} Q${KNOT.x + d},${KNOT.y + 50} ${KNOT.x + d * 1.9},${KNOT.y + 96}` }));
  });
  sway.appendChild(bundle);

  // one stem per flower, rising from the knot
  const stems = el("g", { stroke: "#5C8A6E", "stroke-width": 4.5, "stroke-linecap": "round", fill: "none" });
  FLOWERS.forEach(([x, y]) => {
    const midX = KNOT.x + (x - KNOT.x) * .35;
    stems.appendChild(el("path", { d: `M${KNOT.x},${KNOT.y} Q${midX},${(y + KNOT.y) / 2} ${x},${y + 6}` }));
  });
  sway.appendChild(stems);

  // leaves along the outer stems
  const leaves = el("g", { fill: "#78A38A" });
  [[128, 250, -38], [272, 246, 38], [104, 292, -56], [296, 288, 56], [200, 300, 8]].forEach(([x, y, r]) => {
    leaves.appendChild(el("path", {
      d: "M0,0 C 13,-13 13,-34 0,-46 C -13,-34 -13,-13 0,0 Z",
      transform: `translate(${x},${y}) rotate(${r}) scale(1.05)`,
      opacity: ".82"
    }));
  });
  sway.appendChild(leaves);

  // wrapping paper - two sheets that fall open on bloom
  const paperL = el("path", { class: "paper paper--l", fill: "#1B4038", d: `M${KNOT.x},${KNOT.y + 6} L88,236 Q152,286 ${KNOT.x},268 Z`, opacity: ".95" });
  const paperR = el("path", { class: "paper paper--r", fill: "#164039", d: `M${KNOT.x},${KNOT.y + 6} L312,236 Q248,286 ${KNOT.x},268 Z`, opacity: ".95" });
  sway.appendChild(paperL);
  sway.appendChild(paperR);

  // flower heads
  FLOWERS.forEach(([x, y, r, n, ci], i) => {
    const [light, dark] = PETAL_COLORS[ci];
    const head = el("g", { class: "head", transform: `translate(${x},${y})`, "data-i": i });
    head.dataset.x = x; head.dataset.y = y;

    for (let p = 0; p < n; p++) {
      const a = (360 / n) * p + i * 11;
      head.appendChild(el("ellipse", { cx: 0, cy: -r * .54, rx: r * .32, ry: r * .56, fill: light, transform: `rotate(${a})` }));
    }
    for (let p = 0; p < n; p++) {
      const a = (360 / n) * p + i * 11 + (180 / n);
      head.appendChild(el("ellipse", { cx: 0, cy: -r * .34, rx: r * .21, ry: r * .36, fill: dark, opacity: ".62", transform: `rotate(${a})` }));
    }
    head.appendChild(el("circle", { r: r * .25, fill: "#E9C27E" }));
    head.appendChild(el("circle", { r: r * .13, fill: "#B8873F", opacity: ".65" }));
    sway.appendChild(head);
  });

  // ribbon at the knot
  const ribbon = el("g", { fill: "#E4705A" });
  ribbon.appendChild(el("path", { d: `M${KNOT.x},${KNOT.y} C${KNOT.x - 44},${KNOT.y - 28} ${KNOT.x - 52},${KNOT.y + 16} ${KNOT.x},${KNOT.y + 4} Z` }));
  ribbon.appendChild(el("path", { d: `M${KNOT.x},${KNOT.y} C${KNOT.x + 44},${KNOT.y - 28} ${KNOT.x + 52},${KNOT.y + 16} ${KNOT.x},${KNOT.y + 4} Z` }));
  ribbon.appendChild(el("path", { d: `M${KNOT.x - 3},${KNOT.y + 3} C${KNOT.x - 22},${KNOT.y + 34} ${KNOT.x - 26},${KNOT.y + 48} ${KNOT.x - 14},${KNOT.y + 58} L${KNOT.x - 2},${KNOT.y + 22} Z`, opacity: ".9" }));
  ribbon.appendChild(el("path", { d: `M${KNOT.x + 3},${KNOT.y + 3} C${KNOT.x + 22},${KNOT.y + 34} ${KNOT.x + 26},${KNOT.y + 48} ${KNOT.x + 14},${KNOT.y + 58} L${KNOT.x + 2},${KNOT.y + 22} Z`, opacity: ".9" }));
  ribbon.appendChild(el("ellipse", { cx: KNOT.x, cy: KNOT.y + 2, rx: 9, ry: 8, fill: "#E9C27E" }));
  sway.appendChild(ribbon);

  svg.appendChild(sway);
  return svg;
}

const bouquetBtn = document.getElementById("bouquet");
bouquetBtn.appendChild(buildBouquet());

/* ------------------------------------------------------------------
   Canvas petals: a slow ambient drift, plus a burst on bloom.
------------------------------------------------------------------ */
const canvas = document.getElementById("petals");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, dpr = 1;
let petals = [];

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);
resize();

const FLAT = PETAL_COLORS.flat();
const rand = (a, b) => a + Math.random() * (b - a);

function makePetal(opts = {}) {
  return {
    x: opts.x ?? rand(0, W),
    y: opts.y ?? rand(-H * .4, -10),
    vx: opts.vx ?? rand(-.24, .24),
    vy: opts.vy ?? rand(.32, .9),
    rot: rand(0, Math.PI * 2),
    vr: rand(-.035, .035),
    size: opts.size ?? rand(4.5, 10),
    color: FLAT[(Math.random() * FLAT.length) | 0],
    alpha: opts.alpha ?? rand(.35, .85),
    fade: opts.fade ?? 0,
    drag: opts.drag ?? 1
  };
}

function seedAmbient(n) {
  for (let i = 0; i < n; i++) petals.push(makePetal({ y: rand(-H, H) }));
}

function burst(originX, originY, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2);
    const s = rand(2.5, 11);
    petals.push(makePetal({
      x: originX, y: originY,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - rand(1, 4),
      size: rand(5, 13),
      alpha: 1,
      fade: rand(.0016, .005),
      drag: .972
    }));
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  for (let i = petals.length - 1; i >= 0; i--) {
    const p = petals[i];
    p.vx *= p.drag;
    p.vy = p.drag < 1 ? p.vy * p.drag + .1 : p.vy;
    p.x += p.vx + Math.sin((p.y + p.rot * 40) / 120) * .35;
    p.y += p.vy;
    p.rot += p.vr;
    if (p.fade) p.alpha -= p.fade;

    if (p.alpha <= .02 || p.y > H + 40) {
      if (p.fade) { petals.splice(i, 1); continue; }
      p.y = -20; p.x = rand(0, W); p.alpha = rand(.35, .85);
    }

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size * .56, p.size, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  requestAnimationFrame(draw);
}

if (!reduced) {
  seedAmbient(26);
  requestAnimationFrame(draw);
}

/* ------------------------------------------------------------------
   The bloom.
------------------------------------------------------------------ */
const giftAct = document.getElementById("gift");
const wishAct = document.getElementById("wish");
const riser   = document.getElementById("riser");
let opened = false;

function bloom() {
  if (opened) return;
  opened = true;
  bouquetBtn.setAttribute("aria-label", "Bouquet opened");

  if (reduced) {
    giftAct.dataset.hidden = "true";
    wishAct.dataset.hidden = "false";
    return;
  }

  // send each flower head outward from the bouquet's centre
  const rect = bouquetBtn.getBoundingClientRect();
  bouquetBtn.querySelectorAll(".head").forEach(h => {
    const hx = +h.dataset.x, hy = +h.dataset.y;
    const dx = (hx - KNOT.x) * 2.6 + rand(-30, 30);
    const dy = (hy - KNOT.y) * 2.2 - rand(60, 150);
    h.style.transform = `translate(${hx + dx}px, ${hy + dy}px) rotate(${rand(-90, 90)}deg) scale(.4)`;
  });
  bouquetBtn.dataset.open = "true";

  burst(rect.left + rect.width / 2, rect.top + rect.height * .45, 110);
  setTimeout(() => burst(rect.left + rect.width / 2, rect.top + rect.height * .3, 55), 260);

  setTimeout(() => { giftAct.dataset.leaving = "true"; }, 240);
  setTimeout(() => {
    giftAct.dataset.hidden = "true";
    wishAct.dataset.hidden = "false";
    // restart the staggered reveal
    riser.classList.remove("rise");
    void riser.offsetWidth;
    riser.classList.add("rise");
  }, 760);
}

function reset() {
  opened = false;
  bouquetBtn.removeAttribute("data-open");
  bouquetBtn.setAttribute("aria-label", "Open the bouquet");
  bouquetBtn.querySelectorAll(".head").forEach(h => { h.style.transform = `translate(${h.dataset.x}px, ${h.dataset.y}px)`; });
  wishAct.dataset.hidden = "true";
  giftAct.dataset.hidden = "false";
  giftAct.removeAttribute("data-leaving");
  bouquetBtn.focus();
}

bouquetBtn.addEventListener("click", bloom);
document.getElementById("replay").addEventListener("click", reset);
</script>
